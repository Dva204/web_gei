services:
  postgres:
    image: postgres:16-alpine
    container_name: vuon-ngon-tinh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vuon_ngon_tinh
      POSTGRES_USER: vuon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vuon_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vuon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vuon -d vuon_ngon_tinh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vuon_postgres_data:
